plugins {
    // build.gradle 이 JDK 17 을 못박고 있는데(toolchain), 빌드하는 쪽에 17 이 없으면
    // Gradle 은 "No locally installed toolchains match" 로 선다 — 다른 버전으로
    // 대충 컴파일해 주지 않는다. 그 판단은 옳다. 다만 받아 올 곳을 알려 줘야 한다.
    //
    // Dockerfile 로 빌드하면 temurin:17-jdk 라 이 플러그인이 할 일이 없다.
    // Railway 가 Dockerfile 대신 Railpack 을 골랐을 때를 위한 안전망이다 —
    // 빌더가 무엇을 깔든 결과 바이트코드가 같아야 한다
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'board-server'

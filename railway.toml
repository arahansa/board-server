# Railway 배포 설정.
#
# 볼륨은 여기서 못 만든다 — 대시보드(Settings → Volumes → Add Volume)나 CLI 로
# 붙인다. 붙이면 Railway 가 RAILWAY_VOLUME_MOUNT_PATH 를 넣어 주고,
# application.yml 이 그 값을 H2 파일 경로로 쓴다. 안 붙이면 VolumeGuard 가 세운다.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# H2 파일은 두 프로세스가 나눠 쓸 수 없다. 볼륨도 한 서비스에 하나다 —
# 이 값을 올리면 두 번째 인스턴스가 파일 잠금에서 막힌다
numReplicas = 1

# 볼륨이 붙은 서비스는 새 컨테이너와 옛 컨테이너가 겹칠 수 없다.
# 겹치기를 끄지 않으면 배포가 볼륨을 기다리다 만다
overlapSeconds = 0

healthcheckPath = "/api/posts"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

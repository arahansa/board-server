spring:
  application:
    name: board-server

  datasource:
    # 파일 모드다. 껐다 켜도 글이 남아 있어야 워크플로우를 이어서 시연할 수 있다.
    # 메모리 모드로 두면 재시작마다 게시판이 비어 "연결됨" 을 확인할 수 없다.
    #
    # 어느 디렉터리에 쓸지는 RAILWAY_VOLUME_MOUNT_PATH 가 정한다 — Railway 가 볼륨을
    # 붙이면 스스로 넣어 주는 값이다. 로컬에는 그 변수가 없으니 ./data 로 떨어진다.
    # 한 줄로 두 환경이 갈리므로 프로파일을 나누지 않는다.
    #
    # ★ 컨테이너의 파일시스템은 재배포·재시작마다 사라진다. 볼륨 없이 Railway 에
    #   올리면 ddl-auto 가 빈 스키마를 다시 만들어 에러 없이 빈 게시판이 된다 —
    #   조용해서 더 나쁘다. VolumeGuard 가 그 경우 아예 뜨지 않게 막는다
    url: jdbc:h2:file:${RAILWAY_VOLUME_MOUNT_PATH:./data}/board;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      # 예제라 스키마는 엔티티가 만든다. 실제 프로젝트에서는 마이그레이션 도구를 쓴다
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate.format_sql: true

  h2:
    console:
      enabled: true
      path: /h2

server:
  # Railway 는 PORT 를 넣어 주고 그 포트로만 트래픽을 보낸다. 8080 을 박아 두면
  # 빌더가 Dockerfile 이 아닐 때(Railpack) 아무도 덮어 주지 않아 502 가 된다 —
  # 여기서 읽으면 빌더가 무엇이든 같다. 로컬에는 PORT 가 없으니 8080 그대로다
  port: ${PORT:8080}
  servlet:
    # 기획서의 경로에는 /api 가 없다. 여기서 붙이므로 Spring 의 핸들러 매핑 패턴이
    # 문서의 경로와 글자 그대로 같아진다 — 대조 테스트가 보정을 하지 않아도 된다
    context-path: /api

board:
  jwt:
    # 예제 기본값이다. 실제로는 환경변수로 준다 — 이 값이 새면 토큰을 위조할 수 있다
    secret: ${BOARD_JWT_SECRET:board-server-example-secret-key-change-me-please-32bytes}
    ttl-hours: 24

logging:
  level:
    org.hibernate.SQL: warn

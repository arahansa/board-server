# 테스트는 메모리 DB 를 본다. 앱은 ./data/board 파일을 쓴다 —
# 테스트가 매번 스키마를 새로 만들기 때문에 실데이터와 분리해야 한다.
spring.datasource.url=jdbc:h2:mem:board-test;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop

# 토큰 유효기간을 짧게 둘 이유가 없다. 만료를 시험하는 테스트는 없다
board.jwt.secret=test-only-secret-key-that-is-long-enough-32bytes
board.jwt.ttl-hours=1
